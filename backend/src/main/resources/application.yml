server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: angelshot-backend

  sql:
    init:
      mode: never

  datasource:
    # Conexión a Base de Datos PostgreSQL en Supabase
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.ufpqhueytunmdwiwtezd.supabase.co:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 600000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  mail:
    provider: ${MAIL_PROVIDER:auto}
    from: ${MAIL_FROM:Angel Shot <onboarding@resend.dev>}
    resend-api-key: ${RESEND_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:AngelShotDefaultDevSecretKeyEnsure256BitsMinLengthForHMACSHA256!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
